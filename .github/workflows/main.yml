
name: Build Threads-Setup.exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run tauri build -- --bundles nsis

      - name: Rename installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Installer not found"
          }
          Copy-Item $installer.FullName "Threads-Setup.exe"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Threads-Setup
          path: Threads-Setup.exe
          if-no-files-found: error
